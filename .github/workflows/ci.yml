name: C++ checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: clang-format-18 --dry-run -Werror *.cpp
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy 18
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18
      - run: clang-tidy-18 *.cpp -- -std=c++20
